<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل البطريرك</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero compact-hero">
    <div class="container hero-content">
      <p class="eyebrow">سيرة البطريرك</p>
      <h1 id="detailTitle">...</h1>
      <a class="back-link" href="index.html">العودة إلى الصفحة الرئيسية</a>
    </div>
  </header>

  <main class="container detail-page">
    <section class="detail-card">
      <div class="detail-image-frame">
        <img id="detailImage" src="" alt="صورة البطريرك" />
        <p id="detailNoImage" class="no-photo" hidden>لا توجد صورة متاحة</p>
        <button id="detailZoomButton" class="image-view-button detail-zoom-button" type="button" hidden>تكبير الصورة</button>
      </div>
      <div class="detail-content">
        <p class="detail-meta" id="detailMeta"></p>
        <p class="detail-birth" id="detailBirth"></p>
        <p id="detailStory"></p>
        <p class="pope-site">مصدر السيرة: <a id="detailPageLink" href="" target="_blank" rel="noopener">عرض المصدر الخارجي</a></p>
      </div>
    </section>
  </main>

  <script src="pope-data.js?v=20260820-118"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get('id'));
    const pope = popeData.find((item) => item.id === id);

    const title = document.getElementById('detailTitle');
    const image = document.getElementById('detailImage');
    const noImage = document.getElementById('detailNoImage');
    const zoomButton = document.getElementById('detailZoomButton');
    const meta = document.getElementById('detailMeta');
    const birth = document.getElementById('detailBirth');
    const story = document.getElementById('detailStory');
    const detailPageLink = document.getElementById('detailPageLink');

    if (pope) {
      title.textContent = pope.name;
      if (pope.image) {
        image.src = pope.image;
        image.alt = pope.name;
        zoomButton.hidden = false;
        zoomButton.dataset.image = pope.image;
        zoomButton.dataset.title = pope.name;
      } else {
        image.hidden = true;
        noImage.hidden = false;
      }
      meta.textContent = `الفترة: ${pope.reign}`;
      birth.textContent = `الميلاد: ${pope.birth}`;
      story.textContent = pope.story;
      if (detailPageLink) {
        detailPageLink.href = pope.source || 'index.html';
        detailPageLink.textContent = pope.source ? 'عرض المصدر الخارجي' : 'العودة إلى الصفحة الرئيسية';
      }
    } else {
      title.textContent = 'البطريرك غير موجود';
      meta.textContent = 'لم يتم العثور على هذه الصفحة.';
      if (detailPageLink) {
        detailPageLink.href = 'index.html';
        detailPageLink.textContent = 'العودة إلى الصفحة الرئيسية';
      }
    }
  </script>
  <script src="script.js?v=20260824-viewer"></script>
</body>
</html>
