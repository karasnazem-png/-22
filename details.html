<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل البطريرك</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero compact-hero">
    <div class="container hero-content">
      <p class="eyebrow">السيرة الحقيقية</p>
      <h1 id="detailTitle">...</h1>
      <a class="back-link" href="index.html">العودة إلى الصفحة الرئيسية</a>
    </div>
  </header>

  <main class="container detail-page">
    <section class="detail-card">
      <div class="detail-content">
        <p class="detail-meta" id="detailMeta"></p>
        <p class="detail-birth" id="detailBirth"></p>
        <p id="detailStory"></p>
      </div>
    </section>
  </main>

  <script src="pope-data.js?v=20260820-118"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get('id'));
    const pope = popeData.find((item) => item.id === id);

    const title = document.getElementById('detailTitle');
    const meta = document.getElementById('detailMeta');
    const birth = document.getElementById('detailBirth');
    const story = document.getElementById('detailStory');

    if (pope) {
      title.textContent = pope.name;
      meta.textContent = `الفترة: ${pope.reign}`;
      birth.textContent = `الميلاد: ${pope.birth}`;
      story.textContent = pope.story;
    } else {
      title.textContent = 'البطريرك غير موجود';
      meta.textContent = 'لم يتم العثور على هذه الصفحة.';
    }
  </script>
  <script src="script.js?v=20260824-viewer"></script>
</body>
</html>
